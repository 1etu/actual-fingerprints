<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grab your fingerprint</title>
<meta name="description" content="Type a handle and get the synthetic fingerprint that belongs to it, grown in your browser. Same handle, same print, anywhere.">
<link rel="icon" href="../icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="page">

<div class="bar">
  <a class="home" href="../">actual-fingerprints</a>
  <span class="right">
    <iframe src="https://ghbtns.com/github-btn.html?user=1etu&repo=actual-fingerprints&type=star&count=true" frameborder="0" scrolling="0" width="100" height="20" title="Star actual-fingerprints on GitHub"></iframe>
    <a class="btn" href="../">Research &amp; Papers</a>
  </span>
</div>

<main>
<h1>Grab your fingerprint</h1>
<p class="lead">Write your handle. The print that belongs to it is grown here, in your browser, and no other handle can produce it.</p>

<form id="form">
  <span class="at">@</span><input type="text" id="handle" placeholder="handle" spellcheck="false" autocomplete="off" autocapitalize="none">
  <button type="submit">Grab</button>
</form>

<div id="print" hidden>
  <div class="frame" tabindex="0">
    <canvas id="stage" width="320" height="400" aria-label="The fingerprint that belongs to this handle."></canvas>
    <div class="tools">
      <button type="button" id="png">PNG</button>
      <button type="button" id="svg">SVG</button>
      <button type="button" id="share">Share</button>
    </div>
  </div>
  <p class="meta" id="meta"></p>
  <p class="note" id="note" role="status" aria-live="polite"></p>
</div>
</main>

<p class="foot">Nothing is sent and nothing is stored. The handle is the seed and the print is the arithmetic. <a href="../">How it works.</a></p>

</div>

<script src="../demo.js"></script>
<script src="site.js"></script>
</body>
</html>
