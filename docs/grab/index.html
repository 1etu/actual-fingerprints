<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grab your fingerprint</title>
<meta name="description" content="Type a handle and watch the fingerprint that belongs to it grow onto a record sheet, in your browser.">
<link rel="icon" href="../icon.png">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<header>
  <a href="../">actual-fingerprints</a>
  <nav>
    <iframe src="https://ghbtns.com/github-btn.html?user=1etu&repo=actual-fingerprints&type=star&count=true" frameborder="0" scrolling="0" width="100" height="20" title="Star actual-fingerprints on GitHub"></iframe>
    <a href="../">Research &amp; Papers</a>
  </nav>
</header>

<form id="sheet">
  <table>
    <tr><th colspan="3">FINGERPRINT RECORD SHEET</th></tr>
    <tr>
      <td class="name">Name: @<input type="text" id="handle" spellcheck="false" autocomplete="off" autocapitalize="none" aria-label="Handle"></td>
      <td>Class: <span id="m-class"></span></td>
      <td>Date: <span id="m-date"></span></td>
    </tr>
    <tr>
      <td colspan="3" class="box">
        <div class="label">1. Thumb</div>
        <div class="frame" tabindex="0">
          <canvas id="stage" width="320" height="400" aria-label="The fingerprint for this handle."></canvas>
          <div class="tools" id="tools" hidden>
            <button type="button" id="png">png</button>
            <button type="button" id="svg">svg</button>
            <button type="button" id="share">share</button>
          </div>
        </div>
        <div class="hint" id="hint">Type a handle and press enter</div>
      </td>
    </tr>
    <tr>
      <td class="name">Minutiae: <span id="m-count"></span></td>
      <td colspan="2">Ref: <span id="m-link"></span></td>
    </tr>
  </table>
</form>

<footer>Grown in your browser. Nothing is stored. <a href="../">How it works</a></footer>

<script src="../demo.js"></script>
<script src="site.js?v=3"></script>
</body>
</html>
